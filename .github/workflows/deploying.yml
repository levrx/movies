name: Sync fork

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"  
  workflow_dispatch:

jobs:
  sync:
    name: Sync fork
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  

      - name: Add upstream remote
        run: git remote add upstream https://github.com/p-stream/p-stream.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream changes into fork
        run: |
          git checkout production
          git merge upstream/production --no-edit

      - name: Push merged changes to fork
        run: git push origin production
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: gautamkrishnar/keepalive-workflow@v1
